<body>
<main><section class="card">
  <header><div><h1>95598 代理购电资料中心</h1><div class="sub">各省代理购电页签、目录资料和本地获取状态</div></div><div class="header-right"><span id="liveDot" class="dot"></span><span id="serverText">正在连接本地服务…</span></div></header>

  <div id="status" aria-live="polite"><div class="status-line"><span id="phaseBadge" class="badge">就绪</span><span id="statusText">正在读取目录…</span></div><div id="statusMeta" class="status-meta"></div></div>
  <div class="stats"><div class="stat"><span>省份来源</span><b id="provinceCount">0</b></div><div class="stat"><span>目录资料</span><b id="totalCount">0</b></div><div class="stat"><span>PDF</span><b id="pdfCount">0</b></div><div class="stat"><span>图片</span><b id="imageCount">0</b></div><div class="stat"><span>网页</span><b id="htmlCount">0</b></div><div class="stat"><span>其他</span><b id="otherCount">0</b></div><div class="stat"><span>已获取</span><b id="downloadedCount">0</b></div><div class="stat"><span>未获取</span><b id="missingCount">0</b></div></div>
  <div id="notice" class="notice" hidden></div><div class="section-title"><h2>双电网代理购电目录</h2><span id="sectionHint" class="hint"></span></div>

  <footer>国家电网显示电价标准页签中的 PDF/图片；南方电网显示“电价及收费标准”中标题含“代理购电”的 PDF/图片。状态按本地目录实时判断，未获取资料支持单条、按省或全部保存。</footer>
</section></main>
<script>
  const token='__CONTROL_TOKEN__', $=s=>document.querySelector(s); const statusBox=$('#status'),phaseBadge=$('#phaseBadge'),statusText=$('#statusText'),statusMeta=$('#statusMeta'),notice=$('#notice'),provinceRows=$('#provinceRows'),searchInput=$('#searchInput'),typeFilter=$('#typeFilter'),statusFilter=$('#statusFilter');
  let catalog=[],runtime={},expanded=new Set(),selected=new Set(),pollTimer=null,catalogLoading=false;
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function api(path,options={}){const headers=Object.assign({'X-95598-Token':token},options.headers||{});return fetch(path,Object.assign({},options,{headers})).then(async r=>{const p=await r.json().catch(()=>({ok:false,message:'服务器返回无效数据。'}));if(!r.ok||(p.ok===false&&p.message))throw Error(p.message||`HTTP ${r.status}`);return p;});}
  const phaseLabel=p=>({idle:'就绪',queued:'排队中',starting_browser:'启动 Edge',connecting_browser:'连接 Edge',loading_page:'打开页面',selecting_region:'选择地区',opening_category:'打开栏目',scanning:'扫描中',waiting_validation:'等待验证',resuming:'继续扫描',downloading:'下载中',download_complete:'下载完成',complete:'已完成',warning:'部分完成',stopping:'停止中',stopped:'已停止',error:'出错'}[p]||p||'就绪');
  const phaseClass=p=>p==='waiting_validation'?'waiting':p==='warning'?'waiting':p==='error'?'error':['complete','download_complete','stopped','idle'].includes(p)?'ok':'running';
  function normType(i){const v=String(i.type||i.format||'').toLowerCase(),u=i.url||'';if(i.is_pdf===true||v.includes('pdf')||/\.pdf(?:$|[?#])/i.test(u))return'pdf';if(v==='html'||/\.html?(?:$|[?#])/i.test(u))return'html';if(v.includes('image')||/\.(png|jpe?g|gif|webp|bmp|tiff?)(?:$|[?#])/i.test(u))return'image';return'other';}
  const typeLabel=t=>t==='pdf'?'PDF':t==='image'?'图片':t==='html'?'网页':'其他';
  function normStatus(i){const v=String(i.local_status||i.status||'').toLowerCase();if(['downloaded','existing','acquired','已获取','已下载'].includes(v))return'downloaded';if(['failed','error','下载失败','失败'].includes(v))return'failed';if(i.path&&i.path!==''&&i.local_exists!==false)return'downloaded';return'missing';}

  const safePath=p=>String(p||'').split('\\').map(encodeURIComponent).join('/');
  function normalizeItem(i,p){const c=Object.assign({},i||{});c.title=c.title||c.name||c.knoweleTitle||'未命名资料';c.url=c.url||c.pdf_url||c.pdfAddress||c.knoweleContentUrl||'';c.type=normType(c);c.local_status=normStatus(c);c.province=c.province||p;c.path=c.path||c.local_file||c.local_path||c.file||'';c.selectKey=c.url;return c;}
  function normalizeProvince(e){const p=Object.assign({},e||{});p.province=p.province||p.name||p.provinceName||'未命名省份';p.provinceCode=p.provinceCode||p.province_code||p.code||'';p.network=String(p.network||p.source_network||'sgcc').toLowerCase();p.grid=p.grid||(p.network==='csg'?'南方电网':'国家电网');p.category=p.category||{};p.tabFound=p.tab_found!==false;p.categoryTitle=p.categoryTitle||p.category_title||p.category.title||p.tab_name||p.tab||p.tab_title||(p.tabFound?'代理购电':'未识别到页签');p.categoryUrl=p.categoryUrl||p.category_url||p.category.url||'';p.region=p.region||{};p.regionText=p.regionText||[p.region.city,p.region.county,p.region.areaCode].filter(Boolean).join(' / ');const raw=Array.isArray(p.items)?p.items:Array.isArray(p.records)?p.records:[];p.items=raw.map(i=>normalizeItem(i,p.province));return p;}
  const fromLegacy=s=>{const its=Array.isArray(s.items)?s.items.map(i=>normalizeItem(i,'北京')):[];return its.length?[{province:'北京市',provinceCode:'110000',categoryTitle:'工商业用户代理购电',items:its}]:[];};
  function mergeSummaries(ss){if(!Array.isArray(ss)||!ss.length)return;const key=p=>`${p.network||'sgcc'}:${p.province}`;const m=new Map(catalog.map(p=>[key(p),p]));for(const raw of ss){const n=normalizeProvince(raw),c=m.get(key(n));if(c&&c.items.length&&!n.items.length)Object.assign(c,n,{items:c.items});else if(c)Object.assign(c,n);else m.set(key(n),n);}catalog=[...m.values()];}
  function pStats(p){const s={total:0,pdf:0,image:0,html:0,other:0,downloaded:0,missing:0,failed:0};for(const i of p.items||[]){s.total++;s[i.type]=(s[i.type]||0)+1;s[i.local_status]=(s[i.local_status]||0)+1;}return s;}
  function updateCounts(){const a=catalog.flatMap(p=>p.items||[]),s={total:a.length,pdf:0,image:0,html:0,other:0,downloaded:0,missing:0,failed:0};for(const i of a){s[i.type]++;s[i.local_status]++;}$('#provinceCount').textContent=catalog.length;$('#totalCount').textContent=s.total;$('#pdfCount').textContent=s.pdf;$('#imageCount').textContent=s.image;$('#htmlCount').textContent=s.html;$('#otherCount').textContent=s.other;$('#downloadedCount').textContent=s.downloaded;$('#missingCount').textContent=s.missing+s.failed;$('#downloadAllBtn').disabled=!s.missing&&!s.failed;return s;}
  function itemMatches(i,p){const q=searchInput.value.trim().toLowerCase();if(q&&!(`${p.grid} ${p.network} ${p.province} ${p.categoryTitle} ${i.title}`.toLowerCase().includes(q)))return false;if(typeFilter.value!=='all'&&i.type!==typeFilter.value)return false;if(statusFilter.value!=='all'&&i.local_status!==statusFilter.value)return false;return true;}
  function pVisible(p){const q=searchInput.value.trim().toLowerCase();if(!q&&typeFilter.value==='all'&&statusFilter.value==='all')return true;if(q&&(`${p.grid} ${p.network} ${p.province} ${p.categoryTitle}`.toLowerCase().includes(q)))return true;return(p.items||[]).some(i=>itemMatches(i,p));}

  function details(p){const vis=(p.items||[]).filter(i=>itemMatches(i,p)),s=pStats(p),n=esc(p.province),body=vis.length?vis.map(itemRow).join(''):`<tr><td class="empty" colspan="7">当前筛选条件下没有资料</td></tr>`;return`<tr class="detail-row"><td colspan="8"><div class="detail"><div class="detail-head"><span>${esc(p.grid||'国家电网')} · ${n} · ${esc(p.categoryTitle||'代理购电')} · 显示 ${vis.length}/${s.total} 条</span><span><button class="mini secondary" data-action="select-province" data-network="${esc(p.network||'sgcc')}" data-province="${n}">选择当前显示</button> <button class="mini secondary" data-action="download-province" data-network="${esc(p.network||'sgcc')}" data-province="${n}">下载本省未获取</button></span></div><div class="detail-table"><table><thead><tr><th style="width:42px">选择</th><th>资料名称</th><th>格式</th><th>本地状态</th><th>本地文件</th><th>原始地址</th><th>操作</th></tr></thead><tbody>${body}</tbody></table></div></div></td></tr>`;}
  function render(){updateCounts();updateSelectionUI();const vis=catalog.filter(pVisible);$('#sectionHint').textContent=vis.length===catalog.length?`共 ${catalog.length} 个电网省份来源`:`筛选后显示 ${vis.length}/${catalog.length} 个来源`;if(!vis.length){provinceRows.innerHTML='<tr><td class="empty" colspan="8">暂无符合条件的省份或资料</td></tr>';return;}const out=[];for(const p of vis){const s=pStats(p),n=esc(p.province),key=`${p.network||'sgcc'}:${p.province}`,open=expanded.has(key),meta=p.regionText?`选择地区：${p.regionText}`:(p.categoryUrl||'网站目录'),cat=p.tabFound===false?`<span class="badge error">未识别到页签</span>`:esc(p.categoryTitle||'代理购电'),disable=s.missing+s.failed?'':' disabled';out.push(`<tr class="province-row" data-province="${n}" data-key="${esc(key)}"><td><span class="badge ${p.network==='csg'?'image':'pdf'}">${esc(p.grid||'国家电网')}</span></td><td><div class="province-name"><button class="chevron" data-action="toggle" data-key="${esc(key)}" aria-label="展开">${open?'⌄':'›'}</button><span>${n}</span></div></td><td class="category">${cat}<small>${esc(meta)}</small></td><td class="num">${s.total}</td><td class="num">${s.pdf}</td><td class="num">${s.image+s.html+s.other}</td><td class="download-cell">${progress(s)}</td><td><button class="mini secondary" data-action="download-province" data-network="${esc(p.network||'sgcc')}" data-province="${n}"${disable}>下载未获取</button></td></tr>`);if(open)out.push(details(p));}provinceRows.innerHTML=out.join('');}
  function renderRuntime(st){runtime=st||{};const p=runtime.phase||'idle',k=phaseClass(p),cs=runtime.catalog_scan||{};statusBox.className=k;phaseBadge.className=`badge ${k}`;phaseBadge.textContent=phaseLabel(p);statusText.textContent=runtime.message||cs.message||'就绪。';const b=[];if(runtime.updated_at)b.push(`更新：${runtime.updated_at}`);if(runtime.last_scan)b.push(`上次扫描：${runtime.last_scan}`);if(runtime.current_item)b.push(`当前：${runtime.current_item}`);statusMeta.textContent=b.join(' · ');$('#scanBtn').disabled=!!runtime.scan_running;$('#showBtn').disabled=!runtime.browser_open;$('#continueBtn').disabled=!runtime.needs_validation;$('#stopBtn').disabled=!runtime.scan_running;$('#downloadAllBtn').disabled=!!runtime.download_running||!catalog.some(p=>(p.items||[]).some(i=>i.local_status!=='downloaded'));if(runtime.download_running&&runtime.download_total){notice.hidden=false;notice.textContent=`下载进度：${runtime.download_done||0}/${runtime.download_total} · ${runtime.current_item||''}`;}else if(cs.running){notice.hidden=false;notice.textContent=`扫描进度：${cs.completed||0}/${cs.total||32} · ${cs.current_province||cs.message||''}`;}else if(runtime.needs_validation){notice.hidden=false;notice.textContent='Edge 页面需要人工完成验证。完成后回到这里点击“继续扫描”。';}else if(!catalog.length&&(runtime.last_error||cs.last_error)){notice.hidden=false;notice.textContent=runtime.last_error||cs.last_error;}else notice.hidden=true;}
  async function loadCatalog(){if(catalogLoading)return;catalogLoading=true;try{let p;try{p=await api('/api/catalog');}catch(_){const s=await api('/api/state');p={provinces:Array.isArray(s.provinces)?s.provinces:fromLegacy(s),scanned_at:s.last_scan};}const inc=p.provinces||p.results||p.catalog||[];if(Array.isArray(inc))catalog=inc.map(normalizeProvince);if(!catalog.length&&p.items)catalog=fromLegacy(p);if(p.scanned_at)runtime.last_scan=p.scanned_at;render();notice.hidden=true;}catch(e){notice.hidden=false;notice.textContent=`目录读取失败：${e.message}`;if(!catalog.length)provinceRows.innerHTML='<tr><td class="empty" colspan="8">目录读取失败，请稍后重试</td></tr>';}finally{catalogLoading=false;}}
  async function loadSummaries(){try{const p=await api('/api/provinces');mergeSummaries(p.provinces||p.results||[]);render();}catch(_){}}
  async function refreshRuntime(){try{const s=await api('/api/state');renderRuntime(s);$('#liveDot').className='dot live';$('#serverText').textContent='本地服务已连接';if(!catalog.length&&(s.items||s.provinces))await loadCatalog();}catch(e){$('#liveDot').className='dot';$('#serverText').textContent='本地服务未连接';statusBox.className='error';statusText.textContent=`状态读取失败：${e.message}`;}}
  async function action(path,opt={},reload=true){try{const r=await api(path,Object.assign({method:'POST'},opt));statusText.textContent=r.message||'操作已提交。';if(reload){await refreshRuntime();await loadCatalog();}}catch(e){statusBox.className='error';statusText.textContent=e.message;}}
  async function waitForSelectedDownloads(){for(let i=0;i<600;i++){await new Promise(r=>setTimeout(r,1000));const state=await api('/api/state');renderRuntime(state);if(!state.download_running){await loadCatalog();return;}}throw Error('等待所选文件下载超时。');}
  async function exportSelected(){let items=selectedItems();if(!items.length)return;$('#exportSelectedBtn').disabled=true;try{const missing=items.filter(i=>i.local_status!=='downloaded');if(missing.length){statusText.textContent=`正在获取所选文件：0/${missing.length}`;await api('/api/catalog/download',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({urls:missing.map(i=>i.url),all_missing:false})});await waitForSelectedDownloads();items=selectedItems();}const response=await fetch('/api/catalog/export',{method:'POST',headers:{'X-95598-Token':token,'Content-Type':'application/json'},body:JSON.stringify({urls:items.map(i=>i.url)})});if(!response.ok){const data=await response.json().catch(()=>({}));throw Error(data.message||`导出失败：HTTP ${response.status}`);}const blob=await response.blob(),disposition=response.headers.get('Content-Disposition')||'',match=disposition.match(/filename\*=UTF-8''([^;]+)/i),filename=match?decodeURIComponent(match[1]):'95598代理购电资料.zip',link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download=filename;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(link.href),30000);statusText.textContent=`已导出 ${items.length} 个所选文件。`;}catch(e){statusBox.className='error';statusText.textContent=e.message;}finally{updateSelectionUI();}}
  async function startScan(){const opt={headers:{'Content-Type':'application/json'},body:JSON.stringify({province:'all'})};try{const r=await api('/api/catalog/scan',Object.assign({method:'POST'},opt));statusText.textContent=r.message||'扫描任务已启动。';}catch(_){try{const r=await api('/api/scan/start',{method:'POST'});statusText.textContent=r.message||'扫描任务已启动。';}catch(e){statusBox.className='error';statusText.textContent=e.message;return;}}await refreshRuntime();await loadCatalog();}
  async function stopScan(){try{const r=await api('/api/catalog/scan/stop',{method:'POST'});statusText.textContent=r.message||'已发出停止请求。';}catch(_){await action('/api/scan/stop',{},false);return;}await refreshRuntime();}
  $('#scanBtn').addEventListener('click',startScan);$('#showBtn').addEventListener('click',()=>action('/api/browser/show',{},false));$('#continueBtn').addEventListener('click',()=>action('/api/scan/continue',{},false));$('#stopBtn').addEventListener('click',stopScan);$('#refreshBtn').addEventListener('click',loadCatalog);$('#statusBtn').addEventListener('click',()=>action('/api/catalog/refresh-status',{},true));$('#downloadAllBtn').addEventListener('click',()=>action('/api/catalog/download',{headers:{'Content-Type':'application/json'},body:JSON.stringify({all_missing:true})},true));$('#exportSelectedBtn').addEventListener('click',exportSelected);$('#clearSelectedBtn').addEventListener('click',()=>{selected.clear();render();});$('#folderBtn').addEventListener('click',()=>action('/api/download/open-folder',{},false));[searchInput,typeFilter,statusFilter].forEach(e=>e.addEventListener('input',render));
  provinceRows.addEventListener('click',e=>{const t=e.target.closest('[data-action]');if(!t){const row=e.target.closest('.province-row');if(row){const key=row.dataset.key||'';expanded.has(key)?expanded.delete(key):expanded.add(key);render();}return;}const a=t.dataset.action,p=t.dataset.province||'',key=t.dataset.key||'';if(a==='toggle'){expanded.has(key)?expanded.delete(key):expanded.add(key);render();}else if(a==='select-item'){t.checked?selected.add(t.dataset.key):selected.delete(t.dataset.key);updateSelectionUI();}else if(a==='select-province'){const group=catalog.find(x=>x.province===p&&(x.network||'sgcc')===(t.dataset.network||'sgcc')),items=(group?.items||[]).filter(i=>itemMatches(i,group)),all=items.length&&items.every(i=>selected.has(i.selectKey));items.forEach(i=>all?selected.delete(i.selectKey):selected.add(i.selectKey));render();}else if(a==='download-province')action('/api/catalog/download',{headers:{'Content-Type':'application/json'},body:JSON.stringify({province:p,network:t.dataset.network||''})},true);else if(a==='download-item')action('/api/catalog/download/item',{headers:{'Content-Type':'application/json'},body:JSON.stringify({url:t.dataset.url||''})},true);});
  function poll(){clearTimeout(pollTimer);pollTimer=setTimeout(async()=>{const wasBusy=!!(runtime.scan_running||runtime.download_running);await refreshRuntime();const isBusy=!!(runtime.scan_running||runtime.download_running);if(wasBusy||isBusy)await loadCatalog();poll();},3000);} (async()=>{await refreshRuntime();await loadCatalog();await loadSummaries();poll();})();
</script>
