<!doctype html>
<html lang="zh-CN">
<head>

  <title>95598 代理购电资料中心</title>
  <style>

    .detail-title { min-width:340px; max-width:600px; line-height:1.45; } .detail-url { min-width:290px; max-width:410px; } code { color:#475569; font-family:Consolas,"Courier New",monospace; font-size:11px; word-break:break-all; }
    .file-link { display:inline-block; max-width:245px; overflow:hidden; text-overflow:ellipsis; vertical-align:bottom; white-space:nowrap; } .empty { padding:30px !important; text-align:center; color:var(--muted); }
    .select-box { width:17px; height:17px; margin:0; vertical-align:middle; accent-color:var(--brand); } .selection-count { min-width:72px; color:#475569; font-size:12px; }
    .notice { margin:0 24px 18px; padding:10px 12px; border-radius:6px; color:#475569; background:#f8fafc; font-size:12px; } footer { padding:0 24px 20px; color:var(--muted); font-size:12px; line-height:1.55; } a { color:#1264d6; text-decoration:none; } a:hover { text-decoration:underline; }
    dialog { width:min(520px,calc(100vw - 28px)); border:1px solid var(--border); border-radius:8px; padding:0; color:var(--ink); box-shadow:0 20px 50px #0f172a33; }

    .setting-row { display:flex; align-items:center; justify-content:space-between; gap:16px; min-height:38px; }

    .check-row { justify-content:flex-start; }
    .check-row input { width:18px; height:18px; }
    .dialog-actions { display:flex; justify-content:flex-end; gap:8px; padding:14px 18px; border-top:1px solid var(--border); }
    @media (max-width:1060px) { .stats { grid-template-columns:repeat(4,minmax(110px,1fr)); } } @media (max-width:700px) { main { width:calc(100vw - 16px); margin:8px auto 18px; } header { padding:16px; } .toolbar,.stats,footer,.section-title { padding-left:16px; padding-right:16px; } #status { margin-left:16px; margin-right:16px; } .table-wrap { margin-left:16px; margin-right:16px; } .stats { grid-template-columns:repeat(2,minmax(110px,1fr)); } .header-right { display:none; } .toolbar .field { flex:1 1 160px; white-space:nowrap; } .toolbar .field input { min-width:0; } input.search { width:100%; } }
  </style>

<body>
<main><section class="card">
  <header><div><h1>95598 代理购电资料中心</h1><div class="sub">国家电网电价标准与南方电网资讯公告统一目录</div></div><div class="header-right"><span id="liveDot" class="dot"></span><span id="serverText">正在连接服务…</span></div></header>
  <div class="toolbar"><button id="scanBtn">扫描双电网最新目录</button><button id="scheduleBtn" class="secondary">定时设置</button><button id="refreshBtn" class="secondary">刷新目录</button><button id="statusBtn" class="secondary">刷新本地状态</button><button id="downloadAllBtn">下载全部未获取</button><button id="exportSelectedBtn" disabled>下载所选</button><button id="clearSelectedBtn" class="secondary" disabled>取消选择</button><span id="selectionCount" class="selection-count">已选 0 项</span><span class="spacer"></span><label class="field">操作令牌 <input id="tokenInput" type="password" placeholder="未配置时留空" style="width:150px"></label><label class="field">搜索 <input id="searchInput" class="search" type="search" placeholder="电网、省份或资料名称"></label><label class="field">类型 <select id="typeFilter"><option value="all">全部</option><option value="pdf">PDF</option><option value="image">图片</option><option value="html">网页</option><option value="other">其他</option></select></label><label class="field">状态 <select id="statusFilter"><option value="all">全部</option><option value="downloaded">已获取</option><option value="missing">未获取</option><option value="failed">失败</option></select></label></div>
  <div id="status" aria-live="polite"><div class="status-line"><span id="phaseBadge" class="badge">就绪</span><span id="statusText">正在读取目录…</span></div><div id="statusMeta" class="status-meta"></div></div>
  <div class="stats"><div class="stat"><span>省份来源</span><b id="provinceCount">0</b></div><div class="stat"><span>目录资料</span><b id="totalCount">0</b></div><div class="stat"><span>PDF</span><b id="pdfCount">0</b></div><div class="stat"><span>图片</span><b id="imageCount">0</b></div><div class="stat"><span>网页</span><b id="htmlCount">0</b></div><div class="stat"><span>其他</span><b id="otherCount">0</b></div><div class="stat"><span>已获取</span><b id="downloadedCount">0</b></div><div class="stat"><span>未获取</span><b id="missingCount">0</b></div></div>
  <div id="notice" class="notice" hidden></div><div class="section-title"><h2>双电网代理购电目录</h2><span id="sectionHint" class="hint"></span></div>
  <div class="table-wrap"><table id="provinceTable"><thead><tr><th>所属电网</th><th style="width:220px">省份</th><th>代理购电栏目</th><th class="num">目录条数</th><th class="num">PDF</th><th class="num">图片/网页</th><th>本地获取进度</th><th>操作</th></tr></thead><tbody id="provinceRows"><tr><td class="empty" colspan="8">正在读取目录…</td></tr></tbody></table></div>
</section></main>
<dialog id="scheduleDialog">
  <form id="scheduleForm">
    <div class="dialog-head"><h2>定时扫描设置</h2><button id="scheduleClose" class="dialog-close" type="button" aria-label="关闭">×</button></div>
    <div class="dialog-body">
      <div class="setting-row check-row"><input id="scheduleEnabled" type="checkbox"><label for="scheduleEnabled">启用定时扫描</label></div>
      <div class="setting-row"><label for="scheduleMode">执行方式</label><select id="scheduleMode"><option value="daily">每天固定时间</option><option value="interval">固定分钟间隔</option><option value="cron">Cron 表达式</option></select></div>
      <div id="dailyRow" class="setting-row"><label for="dailyTime">执行时间</label><input id="dailyTime" type="time" required></div>
      <div id="intervalRow" class="setting-row" hidden><label for="intervalMinutes">间隔分钟</label><input id="intervalMinutes" type="number" min="5" max="10080" step="1"></div>
      <div id="cronRow" class="setting-row" hidden><label for="cronExpression">Cron</label><input id="cronExpression" type="text" placeholder="0 3 * * *"></div>
      <div class="setting-row check-row"><input id="autoDownload" type="checkbox"><label for="autoDownload">扫描后下载新增资料</label></div>
      <div class="setting-row"><label>时区</label><span id="scheduleTimezone" class="hint">Asia/Shanghai</span></div>
    </div>
    <div class="dialog-actions"><button id="scheduleCancel" class="secondary" type="button">取消</button><button type="submit">保存</button></div>
  </form>
</dialog>
<script>
  const $=s=>document.querySelector(s); const statusBox=$('#status'),phaseBadge=$('#phaseBadge'),statusText=$('#statusText'),statusMeta=$('#statusMeta'),notice=$('#notice'),provinceRows=$('#provinceRows'),searchInput=$('#searchInput'),typeFilter=$('#typeFilter'),statusFilter=$('#statusFilter'),tokenInput=$('#tokenInput'),scheduleDialog=$('#scheduleDialog');
  let catalog=[],runtime={},expanded=new Set(),selected=new Set(),pollTimer=null,catalogLoading=false;
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  tokenInput.value=sessionStorage.getItem('sgccAdminToken')||'';tokenInput.addEventListener('change',()=>sessionStorage.setItem('sgccAdminToken',tokenInput.value.trim()));
  function api(path,options={}){const headers=Object.assign({},options.headers||{}),token=tokenInput.value.trim();if(token)headers['X-Admin-Token']=token;return fetch(path,Object.assign({},options,{headers})).then(async r=>{const p=await r.json().catch(()=>({ok:false,message:'服务器返回无效数据。'}));if(!r.ok||(p.ok===false&&p.message))throw Error(p.detail||p.message||`HTTP ${r.status}`);return p;});}
  const phaseLabel=p=>({idle:'就绪',queued:'排队中',starting_browser:'启动浏览器',connecting_browser:'连接浏览器',loading_page:'打开页面',selecting_region:'选择地区',opening_category:'打开栏目',scanning:'扫描中',waiting_validation:'等待验证',resuming:'继续扫描',downloading:'下载中',download_complete:'下载完成',complete:'已完成',warning:'部分完成',stopping:'停止中',stopped:'已停止',error:'出错'}[p]||p||'就绪');
  const phaseClass=p=>p==='waiting_validation'?'waiting':p==='warning'?'warning':p==='error'?'error':['complete','download_complete','stopped','idle'].includes(p)?'ok':'running';
  function normType(i){const v=String(i.type||i.format||'').toLowerCase(),u=i.url||'';if(i.is_pdf===true||v.includes('pdf')||/\.pdf(?:$|[?#])/i.test(u)||/documentType=pdf/i.test(u))return'pdf';if(v==='html'||/\.html?(?:$|[?#])/i.test(u))return'html';if(v.includes('image')||/\.(png|jpe?g|gif|webp|bmp|tiff?)(?:$|[?#])/i.test(u))return'image';return'other';}
  const typeLabel=t=>t==='pdf'?'PDF':t==='image'?'图片':t==='html'?'网页':'其他';
  function normStatus(i){const v=String(i.local_status||i.status||'').toLowerCase();if(['downloaded','existing','acquired','已获取','已下载'].includes(v))return'downloaded';if(['failed','error','下载失败','失败'].includes(v))return'failed';if(i.path&&i.path!==''&&i.local_exists!==false)return'downloaded';return'missing';}
  const statusLabel=s=>s==='downloaded'?'已获取':s==='failed'?'失败':'未获取';
  const safePath=p=>String(p||'').replace(/\\/g,'/').split('/').map(encodeURIComponent).join('/');
  function normalizeItem(i,p){const c=Object.assign({},i||{});c.title=c.title||c.name||c.knoweleTitle||c.infoTitle||'未命名资料';c.url=c.url||c.pdf_url||c.pdfAddress||c.knoweleContentUrl||c.link||'';c.type=normType(c);c.local_status=normStatus(c);c.province=c.province||p;c.path=c.path||c.local_file||c.local_path||c.file||'';c.selectKey=c.item_id||c.id||c.url;return c;}
  function normalizeProvince(e){const p=Object.assign({},e||{});p.province=p.province||p.name||p.provinceName||'未命名省份';p.provinceCode=p.provinceCode||p.province_code||p.code||'';p.network=String(p.network||p.source_network||'sgcc').toLowerCase();p.grid=p.grid||(p.network==='csg'?'南方电网':'国家电网');p.category=p.category||{};p.tabFound=p.tab_found!==false;p.categoryTitle=p.categoryTitle||p.category_title||p.category.title||p.tab_name||p.tab||p.tab_title||(p.tabFound?'代理购电':'未识别到代理购电页签');p.categoryUrl=p.categoryUrl||p.category_url||p.category.url||'';p.region=p.region||{};p.regionText=p.regionText||[p.region.city,p.region.county,p.region.areaCode].filter(Boolean).join(' / ');const raw=Array.isArray(p.items)?p.items:Array.isArray(p.records)?p.records:[];p.items=raw.map(i=>normalizeItem(i,p.province));return p;}
  const fromLegacy=s=>{const its=Array.isArray(s.items)?s.items.map(i=>normalizeItem(i,'北京')):[];return its.length?[{province:'北京市',provinceCode:'110000',categoryTitle:'工商业用户代理购电',items:its}]:[];};
  function mergeSummaries(ss){if(!Array.isArray(ss)||!ss.length)return;const key=p=>`${p.network||'sgcc'}:${p.province}`;const m=new Map(catalog.map(p=>[key(p),p]));for(const raw of ss){const n=normalizeProvince(raw),c=m.get(key(n));if(c&&c.items.length&&!n.items.length)Object.assign(c,n,{items:c.items});else if(c)Object.assign(c,n);else m.set(key(n),n);}catalog=[...m.values()];}
  function pStats(p){const s={total:0,pdf:0,image:0,html:0,other:0,downloaded:0,missing:0,failed:0};for(const i of p.items||[]){s.total++;s[i.type]=(s[i.type]||0)+1;s[i.local_status]=(s[i.local_status]||0)+1;}return s;}
  function updateCounts(){const a=catalog.flatMap(p=>p.items||[]),s={total:a.length,pdf:0,image:0,html:0,other:0,downloaded:0,missing:0,failed:0};for(const i of a){s[i.type]++;s[i.local_status]++;}$('#provinceCount').textContent=catalog.length;$('#totalCount').textContent=s.total;$('#pdfCount').textContent=s.pdf;$('#imageCount').textContent=s.image;$('#htmlCount').textContent=s.html;$('#otherCount').textContent=s.other;$('#downloadedCount').textContent=s.downloaded;$('#missingCount').textContent=s.missing+s.failed;$('#downloadAllBtn').disabled=!s.missing&&!s.failed;return s;}
  function itemMatches(i,p){const q=searchInput.value.trim().toLowerCase();if(q&&!(`${p.grid} ${p.network} ${p.province} ${p.categoryTitle} ${i.title}`.toLowerCase().includes(q)))return false;if(typeFilter.value!=='all'&&i.type!==typeFilter.value)return false;if(statusFilter.value!=='all'&&i.local_status!==statusFilter.value)return false;return true;}
  function pVisible(p){const q=searchInput.value.trim().toLowerCase();if(!q&&typeFilter.value==='all'&&statusFilter.value==='all')return true;if(q&&(`${p.grid} ${p.network} ${p.province} ${p.categoryTitle}`.toLowerCase().includes(q)))return true;return(p.items||[]).some(i=>itemMatches(i,p));}
  function selectedItems(){return catalog.flatMap(p=>p.items||[]).filter(i=>selected.has(i.selectKey));}
  function updateSelectionUI(){const valid=new Set(catalog.flatMap(p=>p.items||[]).map(i=>i.selectKey));selected=new Set([...selected].filter(k=>valid.has(k)));$('#selectionCount').textContent=`已选 ${selected.size} 项`;$('#exportSelectedBtn').disabled=!selected.size;$('#clearSelectedBtn').disabled=!selected.size;}
  function progress(s){const pct=s.total?Math.round((s.downloaded||0)*100/s.total):0;return`<div class="progress" title="${s.downloaded||0}/${s.total||0}"><i style="width:${pct}%"></i></div><small>${s.downloaded||0}/${s.total||0} 已获取</small>`;}
  function localHref(i){if(i.local_url)return i.local_url;if(!i.path)return'';if(/^https?:\/\//i.test(i.path))return i.path;return`/files/${safePath(i.path)}`;}
  function itemRow(i){const t=i.type||'other',s=i.local_status||'missing',u=esc(i.url),k=esc(i.selectKey),checked=selected.has(i.selectKey)?' checked':'',path=esc(i.path||i.local_file||i.error||'—'),local=localHref(i),date=esc(i.discovered_at||i.publish_time||i.downloaded_at||i.time||'');const ll=local?`<a class="file-link" href="${esc(local)}" target="_blank" title="${path}">${path}</a>`:'—',dl=s==='downloaded'?'':(i.downloadable!==false&&i.url?`<button class="mini secondary" data-action="download-item" data-id="${esc(i.item_id||'')}">下载</button>`:'—');return`<tr><td><input class="select-box" type="checkbox" data-action="select-item" data-key="${k}"${checked} aria-label="选择 ${esc(i.title)}"></td><td class="detail-title">${esc(i.title)}${date?`<div><small class="hint">${date}</small></div>`:''}</td><td><span class="badge ${t}">${typeLabel(t)}</span></td><td><span class="badge ${s}">${statusLabel(s)}</span></td><td>${ll}</td><td class="detail-url">${i.url?`<a href="${u}" target="_blank" rel="noreferrer"><code>${u}</code></a>`:'—'}</td><td>${dl}</td></tr>`;}
  function details(p){const vis=(p.items||[]).filter(i=>itemMatches(i,p)),s=pStats(p),n=esc(p.province),body=vis.length?vis.map(itemRow).join(''):`<tr><td class="empty" colspan="7">当前筛选条件下没有资料</td></tr>`;return`<tr class="detail-row"><td colspan="8"><div class="detail"><div class="detail-head"><span>${esc(p.grid||'国家电网')} · ${n} · ${esc(p.categoryTitle||'代理购电')} · 显示 ${vis.length}/${s.total} 条</span><span><button class="mini secondary" data-action="select-province" data-network="${esc(p.network||'sgcc')}" data-province="${n}">选择当前显示</button> <button class="mini secondary" data-action="download-province" data-network="${esc(p.network||'sgcc')}" data-province="${n}">下载本省未获取</button></span></div><div class="detail-table"><table><thead><tr><th style="width:42px">选择</th><th>资料名称</th><th>格式</th><th>本地状态</th><th>本地文件</th><th>原始地址</th><th>操作</th></tr></thead><tbody>${body}</tbody></table></div></div></td></tr>`;}
  function render(){updateCounts();updateSelectionUI();const vis=catalog.filter(pVisible);$('#sectionHint').textContent=vis.length===catalog.length?`共 ${catalog.length} 个电网省份来源`:`筛选后显示 ${vis.length}/${catalog.length} 个来源`;if(!vis.length){provinceRows.innerHTML='<tr><td class="empty" colspan="8">暂无符合条件的省份或资料</td></tr>';return;}const out=[];for(const p of vis){const s=pStats(p),n=esc(p.province),key=`${p.network||'sgcc'}:${p.province}`,open=expanded.has(key),err=(p.errors||[])[0]||'',meta=err?`扫描信息：${err}`:p.regionText?`选择地区：${p.regionText}`:(p.categoryUrl||'网站目录'),baseCat=p.tabFound===false?`<span class="badge error">未识别到页签</span>`:esc(p.categoryTitle||'代理购电'),cat=p.stale?`${baseCat} <span class="badge warning">沿用上次目录</span>`:baseCat,disable=s.missing+s.failed?'':' disabled';out.push(`<tr class="province-row" data-province="${n}" data-key="${esc(key)}"><td><span class="badge ${p.network==='csg'?'image':'pdf'}">${esc(p.grid||'国家电网')}</span></td><td><div class="province-name"><button class="chevron" data-action="toggle" data-key="${esc(key)}" aria-label="展开">${open?'⌄':'›'}</button><span>${n}</span></div></td><td class="category">${cat}<small>${esc(meta)}</small></td><td class="num">${s.total}</td><td class="num">${s.pdf}</td><td class="num">${s.image+s.html+s.other}</td><td class="download-cell">${progress(s)}</td><td><button class="mini secondary" data-action="download-province" data-network="${esc(p.network||'sgcc')}" data-province="${n}"${disable}>下载未获取</button></td></tr>`);if(open)out.push(details(p));}provinceRows.innerHTML=out.join('');}
  function scheduleLabel(s){if(!s||!s.enabled)return'已关闭';if(s.mode==='interval')return`每 ${s.interval_minutes} 分钟`;if(s.mode==='daily')return`每天 ${s.daily_time}`;return s.cron||'已启用';}
  function renderRuntime(st){runtime=st||{};const p=runtime.phase||'idle',k=phaseClass(p);statusBox.className=k;phaseBadge.className=`badge ${k}`;phaseBadge.textContent=phaseLabel(p);statusText.textContent=runtime.message||'就绪。';const b=[];if(runtime.updated_at)b.push(`更新：${runtime.updated_at}`);if(runtime.last_scan)b.push(`上次扫描：${runtime.last_scan}`);b.push(`定时：${scheduleLabel(runtime.schedule)}`);if(runtime.current_item)b.push(`当前：${runtime.current_item}`);statusMeta.textContent=b.join(' · ');$('#scanBtn').disabled=!!runtime.scan_running;$('#downloadAllBtn').disabled=!!runtime.download_running||!catalog.some(p=>(p.items||[]).some(i=>i.local_status!=='downloaded'));if(runtime.download_running&&runtime.download_total){notice.hidden=false;notice.textContent=`下载进度：${runtime.download_completed||0}/${runtime.download_total} · ${runtime.current_item||''}`;}else if(runtime.scan_running){notice.hidden=false;notice.textContent=`扫描进度：${runtime.scan_completed||0}/${runtime.scan_total||32} · ${runtime.current_province||runtime.message||''}`;}else if(!catalog.length&&runtime.last_error){notice.hidden=false;notice.textContent=runtime.last_error;}else notice.hidden=true;}
  async function loadCatalog(){if(catalogLoading)return;catalogLoading=true;try{let p;try{p=await api('/api/catalog');}catch(_){const s=await api('/api/state');p={provinces:Array.isArray(s.provinces)?s.provinces:fromLegacy(s),scanned_at:s.last_scan};}const inc=p.provinces||p.results||p.catalog||[];if(Array.isArray(inc))catalog=inc.map(normalizeProvince);if(!catalog.length&&p.items)catalog=fromLegacy(p);if(p.scanned_at)runtime.last_scan=p.scanned_at;render();notice.hidden=true;}catch(e){notice.hidden=false;notice.textContent=`目录读取失败：${e.message}`;if(!catalog.length)provinceRows.innerHTML='<tr><td class="empty" colspan="7">目录读取失败，请稍后重试</td></tr>';}finally{catalogLoading=false;}}
  async function loadSummaries(){try{const p=await api('/api/provinces');mergeSummaries(p.provinces||p.results||[]);render();}catch(_){}}
  async function refreshRuntime(){try{const s=await api('/api/status');renderRuntime(s);$('#liveDot').className='dot live';$('#serverText').textContent='本地服务已连接';}catch(e){$('#liveDot').className='dot';$('#serverText').textContent='本地服务未连接';statusBox.className='error';statusText.textContent=`状态读取失败：${e.message}`;}}
  async function action(path,opt={},reload=true){try{const r=await api(path,Object.assign({method:'POST'},opt));statusText.textContent=r.message||'操作已提交。';if(reload){await refreshRuntime();await loadCatalog();}}catch(e){statusBox.className='error';statusText.textContent=e.message;}}
  async function waitForSelectedDownloads(){for(let i=0;i<600;i++){await new Promise(r=>setTimeout(r,1000));const state=await api('/api/status');renderRuntime(state);if(!state.download_running){await loadCatalog();return;}}throw Error('等待所选文件下载超时。');}
  async function exportSelected(){let items=selectedItems();if(!items.length)return;$('#exportSelectedBtn').disabled=true;try{const missing=items.filter(i=>i.local_status!=='downloaded');if(missing.length){statusText.textContent=`正在获取所选文件：0/${missing.length}`;await api('/api/download-selected',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({item_ids:missing.map(i=>i.item_id)})});await waitForSelectedDownloads();items=selectedItems();}const headers={'Content-Type':'application/json'},admin=tokenInput.value.trim();if(admin)headers['X-Admin-Token']=admin;const response=await fetch('/api/export',{method:'POST',headers,body:JSON.stringify({item_ids:items.map(i=>i.item_id)})});if(!response.ok){const data=await response.json().catch(()=>({}));throw Error(data.detail||data.message||`导出失败：HTTP ${response.status}`);}const blob=await response.blob(),disposition=response.headers.get('Content-Disposition')||'',match=disposition.match(/filename\*=utf-8''([^;]+)/i),filename=match?decodeURIComponent(match[1]):'95598代理购电资料.zip',url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download=filename;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);statusText.textContent=`已导出 ${items.length} 个所选文件。`;}catch(e){statusBox.className='error';statusText.textContent=e.message;}finally{updateSelectionUI();}}
  async function startScan(){await action('/api/scan',{},false);await refreshRuntime();}
  function showScheduleMode(){const mode=$('#scheduleMode').value;$('#dailyRow').hidden=mode!=='daily';$('#intervalRow').hidden=mode!=='interval';$('#cronRow').hidden=mode!=='cron';}
  function fillSchedule(s){$('#scheduleEnabled').checked=!!s.enabled;$('#scheduleMode').value=s.mode||'daily';$('#dailyTime').value=s.daily_time||'03:00';$('#intervalMinutes').value=s.interval_minutes||1440;$('#cronExpression').value=s.cron||'0 3 * * *';$('#autoDownload').checked=s.download_after_scan!==false;$('#scheduleTimezone').textContent=s.timezone||'Asia/Shanghai';showScheduleMode();}
  async function openSchedule(){try{const r=await api('/api/schedule');fillSchedule(r.schedule||{});scheduleDialog.showModal();}catch(e){statusBox.className='error';statusText.textContent=e.message;}}
  async function saveSchedule(e){e.preventDefault();const payload={enabled:$('#scheduleEnabled').checked,mode:$('#scheduleMode').value,daily_time:$('#dailyTime').value,interval_minutes:Number($('#intervalMinutes').value||1440),cron:$('#cronExpression').value.trim(),download_after_scan:$('#autoDownload').checked};try{const r=await api('/api/schedule',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});scheduleDialog.close();statusText.textContent=r.message||'定时设置已保存。';await refreshRuntime();}catch(err){statusBox.className='error';statusText.textContent=err.message;}}
  $('#scanBtn').addEventListener('click',startScan);$('#scheduleBtn').addEventListener('click',openSchedule);$('#scheduleMode').addEventListener('change',showScheduleMode);$('#scheduleForm').addEventListener('submit',saveSchedule);$('#scheduleClose').addEventListener('click',()=>scheduleDialog.close());$('#scheduleCancel').addEventListener('click',()=>scheduleDialog.close());$('#refreshBtn').addEventListener('click',loadCatalog);$('#statusBtn').addEventListener('click',async()=>{await loadCatalog();statusText.textContent='本地状态已刷新。';});$('#downloadAllBtn').addEventListener('click',()=>action('/api/download/missing',{headers:{'Content-Type':'application/json'},body:'{}'},false));$('#exportSelectedBtn').addEventListener('click',exportSelected);$('#clearSelectedBtn').addEventListener('click',()=>{selected.clear();render();});[searchInput,typeFilter,statusFilter].forEach(e=>e.addEventListener('input',render));
  provinceRows.addEventListener('click',e=>{const t=e.target.closest('[data-action]');if(!t){const row=e.target.closest('.province-row');if(row){const key=row.dataset.key||'';expanded.has(key)?expanded.delete(key):expanded.add(key);render();}return;}const a=t.dataset.action,p=t.dataset.province||'',key=t.dataset.key||'';if(a==='toggle'){expanded.has(key)?expanded.delete(key):expanded.add(key);render();}else if(a==='select-item'){t.checked?selected.add(t.dataset.key):selected.delete(t.dataset.key);updateSelectionUI();}else if(a==='select-province'){const group=catalog.find(x=>x.province===p&&(x.network||'sgcc')===(t.dataset.network||'sgcc')),items=(group?.items||[]).filter(i=>itemMatches(i,group)),all=items.length&&items.every(i=>selected.has(i.selectKey));items.forEach(i=>all?selected.delete(i.selectKey):selected.add(i.selectKey));render();}else if(a==='download-province')action('/api/download/missing',{headers:{'Content-Type':'application/json'},body:JSON.stringify({province:p,network:t.dataset.network||''})},false);else if(a==='download-item')action(`/api/download/${encodeURIComponent(t.dataset.id||'')}`,{},false);});
  function poll(){clearTimeout(pollTimer);pollTimer=setTimeout(async()=>{const wasBusy=!!(runtime.scan_running||runtime.download_running);await refreshRuntime();const isBusy=!!(runtime.scan_running||runtime.download_running);if(wasBusy||isBusy)await loadCatalog();poll();},3000);} (async()=>{await refreshRuntime();await loadCatalog();poll();})();
</script>
